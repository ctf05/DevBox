palette = "neon"

# Starship's 500ms default is tight for this box: `git` and `node` are both
# slow on a cold page cache or a Mutagen-synced worktree, and every timeout
# printed three "[WARN] - (starship::utils): Executing command ... timed out"
# lines straight over the first prompt after `dev <session>`. 2s is enough for
# the cold case while still capping how long a wedged command can stall the
# prompt. STARSHIP_LOG=error (see /etc/zsh/zshenv) keeps the remainder quiet.
command_timeout = 2000

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
style = "blue bold"
truncation_length = 3

[git_branch]
symbol = " "
style = "pink"

[git_status]
style = "red"

[nodejs]
symbol = " "

[python]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

[package]
disabled = true

[palettes.neon]
red = "#ff3d7f"
orange = "#ffb52e"
yellow = "#ffe100"
green = "#7dff3e"
blue = "#c76bff"
purple = "#c76bff"
pink = "#ff56d3"
cyan = "#0dfff8"
text = "#ffffff"
dimmed = "#5d5d5d"
surface = "#252525"
base = "#171717"
