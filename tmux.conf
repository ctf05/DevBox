# System-wide tmux config baked into the devbox image.
# Read before any user ~/.tmux.conf — applies to every session.

# Pin terminal type so tmux doesn't probe the client (DA1/DA2/XTVERSION).
# Probing leaks escape responses into the shell when the client is slow
# to answer — notably Superset's xterm.js terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",ghostty*:RGB"

# Short escape delay so Esc isn't laggy in vim/neovim.
set -sg escape-time 10

# Mouse on (scroll, pane select, resize).
set -g mouse on

# Bigger scrollback than the default 2000.
set -g history-limit 100000

# Focus events forwarded into apps that care (neovim autoread, etc).
set -g focus-events on

# ── Clipboard via OSC 52 ───────────────────────────────────────────
# Tmux emits OSC 52 escape sequences when text enters its paste buffer;
# the terminal emulator on the SSH client (laptop) intercepts them and
# writes the payload to the system clipboard. Works across SSH without
# X11/Wayland forwarding because the bytes ride the existing pty.
set -s set-clipboard on

# Advertise the OSC 52 capability for the terminals we use, in case the
# base terminfo entry doesn't expose `Ms`. Without this tmux silently
# refuses to emit the sequence.
set -as terminal-features ",xterm*:clipboard"
set -as terminal-features ",ghostty*:clipboard"
set -as terminal-features ",tmux*:clipboard"

# Mouse-drag select → copy on release → exit copy-mode (clears highlight).
# `copy-pipe-and-cancel` with no pipe command just writes to the tmux
# buffer; set-clipboard then fires OSC 52 to the laptop's clipboard.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
